name: FW CI (RV64, develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Packages
      run: sudo apt update && sudo apt install gcc-riscv64-unknown-elf
    - name: Build FW (ARM64)
      run: cd src && cd rv64 && make -f ci.make all
